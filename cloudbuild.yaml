# ==============================================================================
# Google Cloud Build Pipeline for SellMyGhar.in
# Builds container and deploys to Google Cloud Run in asia-south1
# ==============================================================================

steps:
  # 1. Build container image using Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/sellmyghar/app:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/sellmyghar/app:latest'
      - '.'

  # 2. Push image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/sellmyghar/app'

  # 3. Deploy to Cloud Run with zero-downtime revision rollout
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sellmyghar-prod'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/sellmyghar/app:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'NODE_ENV=production,APP_URL=https://sellmyghar.in,DATABASE_URL=postgresql://postgres.jtawqvseigeslgbrphfl:[REDACTED_DB_PASSWORD]@aws-0-ap-south-1.pooler.supabase.com:5432/postgres,PG_SSL_ALLOW_INSECURE=true,JWT_SECRET=[REDACTED_JWT_SECRET],AUTH_JWT_ISSUER=https://sellmyghar.in,AUTH_JWT_AUDIENCE=https://sellmyghar.in,INITIAL_STAFF_PASSWORD=[REDACTED_BOOTSTRAP_PASSWORD],INITIAL_ADMIN_PASSWORD=[REDACTED_BOOTSTRAP_PASSWORD],SUPABASE_URL=https://jtawqvseigeslgbrphfl.supabase.co,SUPABASE_ANON_KEY=sb_publishable_8ZaeejigTE9QoQWhNsBn9w_cVuSupIM,VITE_SUPABASE_URL=https://jtawqvseigeslgbrphfl.supabase.co,VITE_SUPABASE_ANON_KEY=sb_publishable_8ZaeejigTE9QoQWhNsBn9w_cVuSupIM,ALLOW_DEV_FALLBACKS=true'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/sellmyghar/app:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/sellmyghar/app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
